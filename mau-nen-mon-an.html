<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#171513">
  <title>So sánh nền ảnh món ăn | Hà Nội Quán</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="css/background-samples.css">
</head>
<body>
  <main class="sample-page">
    <header class="sample-header">
      <a class="sample-brand" href="index.html" aria-label="Về trang chủ Hà Nội Quán">
        <img src="assets/logo.webp" alt="" width="1254" height="1254">
        <span>Hà Nội Quán</span>
      </a>
      <p>So sánh nền ảnh món ăn</p>
      <h1>Ba phương án màu nền</h1>
      <p class="sample-intro">Cùng một món, cùng góc chụp và khung ảnh cắt sát để nhìn rõ màu nào làm món ăn nổi bật nhất.</p>
    </header>

    <section class="sample-grid" aria-label="Ba phương án màu nền">
      <article class="sample-card sample-card-recommended">
        <figure>
          <img src="assets/background-samples/kungbao-red.png" alt="Món Kung Bao trên nền đỏ son" width="1448" height="1086">
          <figcaption>
            <span class="color-chip color-chip-red" aria-hidden="true"></span>
            <div><h2>Đỏ son</h2><p>Nổi món nhất, đúng tinh thần Á Đông và hợp màu nhận diện hiện tại.</p></div>
          </figcaption>
        </figure>
        <strong class="recommendation">Đề xuất chọn</strong>
      </article>

      <article class="sample-card">
        <figure>
          <img src="assets/background-samples/kungbao-mustard.png" alt="Món Kung Bao trên nền vàng mù tạt" width="1448" height="1086">
          <figcaption>
            <span class="color-chip color-chip-mustard" aria-hidden="true"></span>
            <div><h2>Vàng mù tạt</h2><p>Sáng, bắt mắt và làm đĩa đen tách khỏi nền rất rõ.</p></div>
          </figcaption>
        </figure>
      </article>

      <article class="sample-card">
        <figure>
          <img src="assets/background-samples/kungbao-burgundy.png" alt="Món Kung Bao trên nền đỏ rượu" width="1448" height="1086">
          <figcaption>
            <span class="color-chip color-chip-burgundy" aria-hidden="true"></span>
            <div><h2>Đỏ rượu</h2><p>Trầm và sang hơn, hài hòa với giao diện tối nhưng độ tương phản nhẹ hơn.</p></div>
          </figcaption>
        </figure>
      </article>
    </section>

    <aside class="sample-note">
      <strong>Khuyến nghị</strong>
      <p>Chọn nền đỏ son. Màu này làm cơm, rau xanh và đĩa đen nổi rõ nhất, đồng thời bám sát màu thương hiệu Hà Nội Quán.</p>
    </aside>
  </main>
</body>
</html>
